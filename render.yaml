services:
  - type: web
    name: personal-job-agent
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: 8000
      - key: ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCRAPE_INTERVAL_MINUTES
        value: "60"
      - key: MIN_MATCH_SCORE_NOTIFY
        value: "70"
      - key: AUTO_TAILOR_HIGH_MATCH
        value: "true"
      - key: LLM_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_TO
        sync: false
